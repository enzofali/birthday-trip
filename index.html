<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Feliz cumpleaños</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--glass:#0f2a22;--glass2:#17392f;--paper:#e9e3d2;--ink:#2a1a1f;--wine:#7a1e34;--foil:#c2a25a;--muted:#6b5a55;
 color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:radial-gradient(120% 80% at 50% 0%,var(--glass2),var(--glass));color:var(--paper);
 font:400 17px/1.55 Karla,system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px;overflow-x:hidden}
section{width:min(100%,440px);text-align:center;animation:in .8s ease both}
section[hidden]{display:none}
@keyframes in{from{opacity:0}to{opacity:1}}
h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;margin:0;line-height:1.05}
h1{font-size:clamp(2.4rem,11vw,3.4rem)}
.hero .eyebrow{display:block;font:600 .8rem/1 Karla,system-ui,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:var(--foil);margin-bottom:14px;padding-left:.28em}
.hero .name{display:inline-block;font-style:italic;font-size:clamp(3.6rem,19vw,5rem);line-height:.95;letter-spacing:-.01em;position:relative}
.hero .heart{position:absolute;left:100%;top:.08em;margin-left:.08em;font-style:normal;font-size:.36em;line-height:1;transform-origin:50% 60%;animation:beat 2.4s ease-in-out infinite}
@keyframes beat{0%,60%,100%{transform:scale(1)}10%,30%{transform:scale(1.18)}20%{transform:scale(1.02)}}
.wish{margin-top:14px;font:italic 500 1.3rem/1.3 "Cormorant Garamond",Georgia,serif;color:#cfd9d2;min-height:1.3em}
.wish.swap{animation:swap .5s ease both}
@keyframes swap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-size:1.8rem}
p{margin:0}
.soft{color:#b9c7bf}
.btn{margin-top:26px;background:var(--foil);color:#2b2008;border:0;border-radius:999px;padding:14px 28px;font:600 1rem Karla,sans-serif;cursor:pointer;
 -webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
.back{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 8px);left:6px;width:44px;height:44px;display:grid;place-items:center;padding:0;border:0;
 background:none;color:rgba(233,227,210,.6);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:color .2s}
.back:hover,.back:active{color:var(--paper)}
.back svg{width:22px;height:22px}
.back[hidden]{display:none}
.back:focus-visible{outline:2px solid var(--paper);outline-offset:-4px;border-radius:50%}

/* 1 birthday */
.cake{position:relative;width:220px;height:190px;margin:26px auto 0;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cake-art{position:absolute;inset:0;width:100%;height:100%;transform-origin:50% 100%;transition:transform .15s}
.cake:active .cake-art{transform:scale(.98)}
.light{position:absolute;left:50%;bottom:-27px;width:340px;height:340px;margin-left:-170px;border-radius:50%;pointer-events:none;z-index:-1;
 background:radial-gradient(circle,rgba(255,184,80,.24),rgba(255,184,80,.08) 38%,rgba(255,184,80,0) 70%);animation:glow 2.6s ease-in-out infinite alternate;transition:opacity 1.4s ease}
@keyframes glow{from{opacity:.8}to{opacity:1}}
.cake.out .light{opacity:0;animation:none}
.flame{position:absolute;left:50%;bottom:128px;width:18px;height:30px;margin-left:-9px;background:radial-gradient(circle at 50% 70%,#fff3c4,#ffb830 60%,#e8651a);
 border-radius:50% 50% 50% 50%/65% 65% 35% 35%;transform-origin:50% 100%;animation:flick .5s infinite alternate;transition:opacity .3s,transform .3s}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.92,1.08) rotate(3deg)}}
.cake.out .flame{opacity:0;transform:scale(.2);animation:none}
.smoke i{position:absolute;left:50%;bottom:134px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:rgba(225,225,218,.55);filter:blur(3px);opacity:0;pointer-events:none}
.cake.out .smoke i{animation:smoke 2.4s ease-out forwards}
.smoke i:nth-child(2){animation-delay:.15s!important}.smoke i:nth-child(3){animation-delay:.3s!important}
.smoke i:nth-child(4){animation-delay:.5s!important}.smoke i:nth-child(5){animation-delay:.7s!important}.smoke i:nth-child(6){animation-delay:.95s!important}
@keyframes smoke{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:.6}100%{opacity:0;transform:translate(var(--dx),-100px) scale(2.8)}}
.sparkles{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.sparkles i{position:absolute;border-radius:50%;background:#e8cf8f;box-shadow:0 0 6px 1px rgba(232,207,143,.55);opacity:0;animation:twinkle ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.55;transform:translateY(-14px)}}
#wished:not([hidden]){animation:swap .6s ease both}
.halo{position:absolute;left:50%;bottom:113px;width:64px;height:64px;margin-left:-32px;border-radius:50%;pointer-events:none;
 background:radial-gradient(circle,rgba(255,200,90,.55),rgba(255,184,48,0) 70%);animation:pulse 1.6s ease-in-out infinite;transition:opacity .3s}
.halo::after{content:"";position:absolute;inset:-6px;border:2px solid rgba(194,162,90,.7);border-radius:50%;animation:ring 1.6s ease-out infinite}
@keyframes pulse{0%,100%{transform:scale(.85);opacity:.7}50%{transform:scale(1.15);opacity:1}}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(1.5);opacity:0}}
.cake.out .halo{opacity:0;animation:none}
.cake.out .halo::after{animation:none}
#cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#wished{margin-top:20px}
#wished[hidden]{display:block;visibility:hidden}

/* 2 letter */
.env{position:relative;width:270px;height:180px;margin:30px auto 0;background:var(--wine);border:0;border-radius:6px;cursor:pointer;display:block;
 box-shadow:0 20px 40px rgba(0,0,0,.4);-webkit-tap-highlight-color:transparent}
.env::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.07),transparent 50%),linear-gradient(225deg,rgba(0,0,0,.18),transparent 50%);border-radius:6px}
.flap{position:absolute;left:0;right:0;top:0;height:95px;background:#8d2540;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .6s}
.env.open .flap{transform:rotateX(180deg)}
.env .seal{position:absolute;left:50%;top:78px;width:34px;height:34px;margin-left:-17px;border-radius:50%;background:var(--foil);box-shadow:0 2px 6px rgba(0,0,0,.4);transition:opacity .3s}
.env.open .seal{opacity:0}
.paper{background:var(--paper);color:var(--ink);text-align:left;border-radius:6px;padding:28px 24px;margin-top:6px;box-shadow:0 20px 40px rgba(0,0,0,.4);animation:rise .7s ease both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.paper p{font:500 1.28rem/1.45 "Cormorant Garamond",Georgia,serif;margin-bottom:12px}
.paper .sign{font-style:italic;color:var(--wine);margin:18px 0 0}

/* 3 itinerary */
.mapwrap{background:var(--glass2);border-radius:16px;padding:14px 12px 18px;margin-top:18px}
svg.map{width:100%;height:auto;display:block;overflow:visible}
.lbl{font:600 10.5px Karla,sans-serif;fill:#b9c7bf;transition:fill .3s}
.lbl.on{fill:var(--foil)}
.day{font:italic 500 13px "Cormorant Garamond",Georgia,serif;fill:rgba(233,227,210,.5)}
.pin{transition:r .25s,fill .3s}
.hit{fill:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}
.hit:focus-visible{stroke:var(--paper);stroke-width:1.5}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:6px 0 0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:rgba(194,162,90,.35)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:38px;height:38px;border-radius:50%;margin-top:-16px;background:var(--foil);border:3px solid var(--paper);box-shadow:0 2px 8px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:rgba(194,162,90,.35)}
input[type=range]::-moz-range-thumb{width:32px;height:32px;border-radius:50%;background:var(--foil);border:3px solid var(--paper)}
input[type=range]:focus-visible{outline:3px solid var(--paper);outline-offset:2px}
.card{min-height:7.2em;margin-top:10px;padding:0 6px}
.card .when{display:block;font:600 .78rem Karla,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--foil);margin-bottom:2px}
.card b{display:block;font:700 1.5rem/1.15 "Cormorant Garamond",Georgia,serif;margin-bottom:4px}
.card a{color:var(--foil);display:inline-block;margin-top:8px;padding:6px 0}
.facts{list-style:none;padding:0;margin:10px 0 0;text-align:left;font-size:.98rem}
.facts li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid rgba(233,227,210,.18)}
.facts li span:last-child{text-align:right;font-weight:600}
@media (prefers-reduced-motion:reduce){section,.paper{animation:none}.flame,.halo,.halo::after,.hero .heart,.wish.swap,.light,#wished:not([hidden]){animation:none}.smoke,.sparkles{display:none}.flap{transition:none}}
</style>
</head>
<body>

<button class="back" id="back" hidden aria-label="Volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>

<section id="s1">
  <h1 class="hero"><span class="eyebrow">Feliz cumple</span><span class="name"><span id="herName">Pauli</span><span class="heart" aria-hidden="true">❤️</span></span></h1>
  <p class="wish" id="wishline">Pedí un deseo.</p>
  <button class="cake" id="cake" aria-label="Soplar la vela">
    <span class="light"></span>
    <svg class="cake-art" viewBox="0 0 220 190" aria-hidden="true">
      <defs>
        <linearGradient id="bodyG" x1="0" x2="1"><stop offset="0" stop-color="#5a1426"/><stop offset=".45" stop-color="#8a2540"/><stop offset="1" stop-color="#561324"/></linearGradient>
        <linearGradient id="frostG" x1="0" x2="1"><stop offset="0" stop-color="#d9d1bd"/><stop offset=".45" stop-color="#f3eedf"/><stop offset="1" stop-color="#d4ccb7"/></linearGradient>
      </defs>
      <ellipse cx="110" cy="179" rx="104" ry="9" fill="rgba(0,0,0,.35)"/>
      <ellipse cx="110" cy="176" rx="100" ry="8" fill="#e9e3d2" opacity=".28"/>
      <rect x="24" y="100" width="172" height="76" rx="10" fill="url(#bodyG)"/>
      <path fill="url(#frostG)" d="M24 110 Q24 96 38 96 H182 Q196 96 196 110 V114 Q192 117 188 115 V124 Q188 130 182 130 Q176 130 176 124 V116 Q164 119 154 116 V134 Q154 140 148 140 Q142 140 142 134 V116 Q128 119 116 116 V125 Q116 131 110 131 Q104 131 104 125 V116 Q90 119 78 116 V138 Q78 144 72 144 Q66 144 66 138 V116 Q54 119 46 116 V123 Q46 129 40 129 Q34 129 34 123 V116 Q28 116 24 113 Z"/>
      <g fill="#c2a25a">
        <rect x="40" y="150" width="7" height="2.4" rx="1.2" transform="rotate(-25 43 151)"/>
        <rect x="88" y="158" width="7" height="2.4" rx="1.2" transform="rotate(30 91 159)"/>
        <rect x="128" y="148" width="7" height="2.4" rx="1.2" transform="rotate(-40 131 149)"/>
        <rect x="166" y="160" width="7" height="2.4" rx="1.2" transform="rotate(15 169 161)"/>
        <rect x="60" y="164" width="7" height="2.4" rx="1.2" transform="rotate(55 63 165)"/>
        <rect x="150" y="142" width="7" height="2.4" rx="1.2" transform="rotate(70 153 143)"/>
        <rect x="108" y="166" width="7" height="2.4" rx="1.2" transform="rotate(-60 111 167)"/>
      </g>
      <g fill="#e9e3d2" opacity=".75">
        <circle cx="54" cy="104" r="1.6"/><circle cx="84" cy="102" r="1.6"/><circle cx="136" cy="103" r="1.6"/><circle cx="168" cy="101" r="1.6"/>
      </g>
      <rect x="106" y="60" width="8" height="40" rx="3" fill="#c2a25a"/>
      <path d="M106 70 L114 64 M106 80 L114 74 M106 90 L114 84" stroke="#e9e3d2" stroke-width="1.6" opacity=".55"/>
      <line x1="110" y1="53" x2="110" y2="61" stroke="#2b1d12" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <span class="halo"></span><span class="flame"></span>
    <span class="smoke" aria-hidden="true"><i style="--dx:-6px"></i><i style="--dx:8px"></i><i style="--dx:-12px"></i><i style="--dx:5px"></i><i style="--dx:-4px"></i><i style="--dx:12px"></i></span>
  </button>
  <div class="sparkles" id="sparkles" aria-hidden="true"></div>
  <div id="wished" hidden>
    <button class="btn" id="to2">Una cartita para vos</button>
  </div>
</section>

<section id="s2" hidden>
  <button class="env" id="env" aria-label="Abrir el sobre"><span class="flap"></span><span class="seal"></span></button>
  <p class="soft" id="envhint" style="margin-top:18px">Tocá para abrir</p>
  <div id="letter" hidden>
    <div class="paper" id="paper"></div>
    <button class="btn" id="to3">Ver nuestro fin de semana</button>
  </div>
</section>

<section id="s3" hidden>
  <h2>Tu fin de semana de cumpleaños</h2>
  <p class="soft" style="margin-top:6px">Deslizá el círculo dorado o tocá cada parada.</p>
  <div class="mapwrap">
    <svg class="map" viewBox="0 0 320 160" role="img" aria-label="Itinerario del fin de semana, sábado 24 y domingo 25">
      <text class="day" x="60" y="16" text-anchor="middle">Sábado 24</text>
      <text class="day" x="240" y="16" text-anchor="middle">Domingo 25</text>
      <line x1="160" y1="6" x2="160" y2="150" stroke="rgba(233,227,210,.15)" stroke-dasharray="2 4"/>
      <path id="route" d="M20 120 C70 30,120 150,170 90 S250 40,300 60" fill="none" stroke="rgba(194,162,90,.45)" stroke-width="3" stroke-dasharray="6 7" stroke-linecap="round"/>
      <path id="trail" d="M20 120 C70 30,120 150,170 90 S250 40,300 60" fill="none" stroke="#c2a25a" stroke-width="3" stroke-linecap="round"/>
      <g id="stops"></g>
      <circle id="car" pointer-events="none" r="8" fill="#e9e3d2" stroke="#7a1e34" stroke-width="3.5"/>
    </svg>
    <input type="range" id="drive" min="0" max="100" value="0" step="0.5" aria-label="Recorrer el fin de semana">
    <div class="card" id="card" aria-live="polite"></div>
  </div>
</section>

<canvas id="cv" aria-hidden="true"></canvas>

<script>
/* ===== Edit this block ===== */
const TRIP = {
  her: "Pauli",
  from: "Your name",
  letter: [
    "Feliz cumpleaños, mi amor.",
    "Este año quise regalarte algo que podamos recordar los dos: un fin de semana lejos, solo nosotros, con caballos, buen vino y ningún apuro.",
    "Gracias por hacer que los días comunes se sientan como una celebración. No veo la hora de celebrarte como te merecés."
  ],
  sign: "Tuyo,",
  start: ["Sábado 24", "¿Lista?", "Prepará el bolso. Salimos a la mañana."],
  stops: [ // position along the route (0 to 1), short map label, when, title, text, maps query
    [0.12, "Almuerzo",  "Sábado 24 · Almuerzo",   "La Casita de Chocolate", "Empezamos el fin de semana con algo dulce.", "La Casita de Chocolate, Uruguay"],
    [0.36, "Haras",     "Sábado 24 · Tarde",      "Haras Las Tordillas",     "Nuestra casa por el fin de semana. Instalarnos, respirar y disfrutar del campo.", "Haras Las Tordillas, Uruguay"],
    [0.58, "Cabalgata", "Domingo 25 · Mañana",    "Cabalgata",               "Un paseo a caballo por el campo, solo nosotros dos.", "Haras Las Tordillas, Uruguay"],
    [0.80, "Viña Edén", "Domingo 25 · Almuerzo",  "Viña Edén",               "Almuerzo entre viñedos, con una copa de su vino.", "https://www.google.com/maps/place/Vi%C3%B1a+Eden/@-34.6851837,-55.2008744,11.25z/data=!4m9!3m8!1s0x957530aad0b4e617:0x23999ac0291f529e!5m2!4m1!1i2!8m2!3d-34.661876!4d-55.040554!16s%2Fg%2F11c5b0_sht"]
  ],
  arrive: {
    when: "Domingo 25 · Noche",
    title: "Tu cena de cumpleaños",
    text: "Y para cerrar el fin de semana, una cena para celebrarte.",
    facts: [["Cuándo","Sábado 24 y domingo 25 de octubre"],["Dónde dormimos","Haras Las Tordillas"],["Qué llevar","Ropa para montar, calzado cómodo, un abrigo y algo lindo para la cena"]]
  }
};
/* =========================== */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const show = id => {
  ["s1","s2","s3"].forEach(s => $(s).hidden = s !== id);
  $("back").hidden = id === "s1";
  if (id === "s3") drive();
  window.scrollTo(0,0);
};
const go = id => { history.pushState({s:id}, "", "#" + id); show(id); };
history.replaceState({s:"s1"}, "", location.pathname);
addEventListener("popstate", e => show((e.state && e.state.s) || "s1"));
$("back").onclick = () => history.back();
const mapLink = q => `<a href="${esc(/^https:\/\//.test(q) ? q : "https://maps.apple.com/?q=" + encodeURIComponent(q))}" target="_blank" rel="noopener">Abrir en Mapas</a>`;

$("herName").textContent = TRIP.her;
$("paper").innerHTML = TRIP.letter.map(p => `<p>${esc(p)}</p>`).join("") + `<p class="sign">${esc(TRIP.sign)}<br>${esc(TRIP.from)}</p>`;

/* 1 candle + confetti */
const cv = $("cv"), cx = cv.getContext("2d");
let parts = [], raf = 0;
function confetti(){
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const dpr = devicePixelRatio || 1; cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
  const cols = ["#c2a25a","#7a1e34","#e9e3d2","#d6b6c0"];
  parts = Array.from({length:90}, () => ({x:innerWidth/2,y:innerHeight*0.55,vx:(Math.random()-.5)*10,vy:-Math.random()*12-4,
    s:4+Math.random()*5,c:cols[Math.random()*4|0],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:0}));
  cancelAnimationFrame(raf);
  (function f(){ cx.clearRect(0,0,innerWidth,innerHeight);
    parts.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.globalAlpha = Math.max(0,1-p.life/110); cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); cx.restore(); });
    if (parts[0].life < 110) raf = requestAnimationFrame(f); else cx.clearRect(0,0,innerWidth,innerHeight); })();
}
$("cake").onclick = () => {
  if ($("cake").classList.contains("out")) return;
  $("cake").classList.add("out");
  if (navigator.vibrate) { try { navigator.vibrate(40); } catch(e){} }
  const calm = matchMedia("(prefers-reduced-motion:reduce)").matches;
  setTimeout(() => { $("wishline").textContent = "Ojalá se cumpla. 🤗"; $("wishline").classList.add("swap"); confetti(); }, calm ? 0 : 450);
  setTimeout(() => { $("wished").hidden = false; }, calm ? 0 : 1500);
};
for (let i = 0; i < 16; i++){
  const s = document.createElement("i"), size = 2 + Math.random()*2.5;
  s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;animation-duration:${4+Math.random()*4}s;animation-delay:${-Math.random()*8}s`;
  $("sparkles").appendChild(s);
}
$("to2").onclick = () => go("s2");

/* 2 envelope */
$("env").onclick = () => {
  $("env").classList.add("open"); $("envhint").hidden = true;
  setTimeout(() => { $("env").hidden = true; $("letter").hidden = false; }, 650);
};
$("to3").onclick = () => go("s3");

/* 3 itinerary */
const route = $("route"), trail = $("trail"), L = route.getTotalLength(), car = $("car"), NS = "http://www.w3.org/2000/svg";
trail.style.strokeDasharray = L; trail.style.strokeDashoffset = L;
const el = (tag, attrs) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };
const pins = [], lbls = [];
TRIP.stops.forEach((s, i) => {
  const p = route.getPointAtLength(L*s[0]), below = i % 2 === 0;
  const c = el("circle", {cx:p.x, cy:p.y, r:5, fill:"#17392f", stroke:"#e9e3d2", "stroke-width":2, class:"pin"});
  const t = el("text", {x:p.x, y:below ? p.y+20 : p.y-12, "text-anchor":"middle", class:"lbl"});
  t.textContent = s[1];
  $("stops").append(c, t); pins.push(c); lbls.push(t);
});
const end = route.getPointAtLength(L);
const flag = el("circle", {cx:end.x, cy:end.y, r:7, fill:"#17392f", stroke:"#c2a25a", "stroke-width":2.5, class:"pin"});
const flagT = el("text", {x:end.x, y:end.y+22, "text-anchor":"middle", class:"lbl"}); flagT.textContent = "Cena";
$("stops").append(flag, flagT);

let anim = 0;
function jumpTo(target){
  const slider = $("drive"), from = +slider.value;
  cancelAnimationFrame(anim);
  if (matchMedia("(prefers-reduced-motion:reduce)").matches){ slider.value = target; drive(); return; }
  const t0 = performance.now(), dur = 300 + Math.abs(target-from)*8;
  (function step(now){
    const k = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-k,3);
    slider.value = from + (target-from)*e; drive();
    if (k < 1) anim = requestAnimationFrame(step);
  })(t0);
}
$("drive").addEventListener("pointerdown", () => cancelAnimationFrame(anim));
[...TRIP.stops.map(s => [s[0]*100, s[3], route.getPointAtLength(L*s[0])]), [100, TRIP.arrive.title, end]].forEach(([target, name, p]) => {
  const h = el("circle", {cx:p.x, cy:p.y, r:20, class:"hit", tabindex:0, role:"button", "aria-label":name});
  h.addEventListener("click", () => jumpTo(target));
  h.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); jumpTo(target); } });
  $("stops").appendChild(h);
});

function drive(){
  const v = $("drive").value/100, p = route.getPointAtLength(L*v);
  car.setAttribute("cx",p.x); car.setAttribute("cy",p.y);
  trail.style.strokeDashoffset = L*(1-v);
  TRIP.stops.forEach((s, i) => {
    const on = v >= s[0];
    pins[i].setAttribute("fill", on ? "#7a1e34" : "#17392f"); pins[i].setAttribute("r", on ? 6 : 5);
    lbls[i].classList.toggle("on", on);
  });
  const card = $("card"), done = v >= 0.985;
  flag.setAttribute("fill", done ? "#c2a25a" : "#17392f"); flagT.classList.toggle("on", done);
  if (done){
    const A = TRIP.arrive;
    card.innerHTML = `<span class="when">${esc(A.when)}</span><b>${esc(A.title)}</b><p class="soft">${esc(A.text)}</p>
      <ul class="facts">${A.facts.map(f => `<li><span class="soft">${esc(f[0])}</span><span>${esc(f[1])}</span></li>`).join("")}</ul>`;
    if (!drive.cheered){ drive.cheered = true; confetti(); }
    return;
  }
  const hit = TRIP.stops.filter(s => v >= s[0]).pop();
  card.innerHTML = hit
    ? `<span class="when">${esc(hit[2])}</span><b>${esc(hit[3])}</b><p class="soft">${esc(hit[4])}</p>${mapLink(hit[5])}`
    : `<span class="when">${esc(TRIP.start[0])}</span><b>${esc(TRIP.start[1])}</b><p class="soft">${esc(TRIP.start[2])}</p>`;
}
$("drive").addEventListener("input", drive);
</script>
</body>
</html>
